name: ana_ifs_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.1
  sign_in_button: ^3.2.0
  cupertino_icons: ^1.0.8
  firebase_storage: ^12.4.10
  http: ^1.1.0
  page_transition: ^2.0.9  # Smooth page transitions
  syncfusion_flutter_sliders: ^23.2.7  # Better sliders
  percent_indicator: ^4.2.3
  webview_flutter: ^4.5.0
  cloud_firestore: ^5.6.12
  provider: ^6.1.1
  model_viewer_plus: ^1.4.0
  gif: ^2.3.0
  audio_session: ^0.1.18
  path_provider: ^2.1.5
  just_audio: ^0.9.40
  noise_meter: ^5.0.0
  babylonjs_viewer: ^1.3.0
  camera: ^0.10.5+6  # Latest stable version
  camera_platform_interface: ^2.7.2
  speech_to_text: ^7.0.0
  image_picker: ^1.0.2
  path: ^1.8.3
  flutter_sound: ^9.30.0
  flutter_dotenv: ^5.1.0
  http_parser: ^4.0.2  # Add this for MediaType
  record: ^6.1.2  # Add this to your pubspec.yaml
  audioplayers: ^5.2.1
  video_player: ^2.7.2
  image: ^4.1.1
  o3d: ^3.1.3
  cached_network_image: ^3.3.0
  flutter_tts: ^3.8.5
  fl_chart: ^0.66.0
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  flutter_launcher_icons: ^0.14.3
  crypto: ^3.0.3
  encrypt: ^5.0.3
  wakelock_plus: ^1.6.0
  permission_handler: ^11.3.0
  flutter_local_notifications: ^21.0.0
  workmanager: ^0.9.0+3
  timezone: ^0.11.0
  vibration: ^3.1.8
  flutter_timezone: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_launcher_icons:
  android: true
  ios: true
  image_path_ios: "assets/images/app_icon.png"
  image_path_android: "assets/images/ANA's-logo.png"
  adaptive_icon_foreground: "assets/images/ANA's-logo.png"
  adaptive_icon_background: "#F2F5FF"
# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
     - assets/animations/meditation.gif
     - assets/animations/guider.gif
     - assets/animations/guider_chat.gif
     - assets/animations/voice_sphere.gif
     - assets/animations/inner_critic.mp4
     - assets/animations/overwhelmed.mp4
     - assets/animations/inner_criti.mp4  # Note: typo? Should be inner_critic.mp4?
     - assets/animations/innner.mp4
     - assets/animations/lonly.mp4
     - assets/animations/inner.webm
     - assets/images/
     - assets/images/characters_full_body/
     - assets/data/
     - assets/models/
     - assets/moods/



  # An image asset can refer to one or more resolution-specific "variants", see
